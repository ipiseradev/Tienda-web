<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha técnica (ejemplo) | VoltWear</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background: #f4f7fb;
        color: #0a0b12;
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      .card {
        background: white;
        border: 1px solid rgba(47, 66, 99, 0.12);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(20, 35, 60, 0.12);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0;
        color: rgba(10, 11, 18, 0.72);
        line-height: 1.5;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 16px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(47, 66, 99, 0.1);
        background: rgba(244, 247, 251, 0.65);
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(10, 11, 18, 0.46);
        font-weight: 700;
      }
      .value {
        font-weight: 700;
      }
      .note {
        margin-top: 14px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Ficha técnica (ejemplo)</h1>
        <p>
          Esta ficha es un placeholder para demo/UI. Reemplazala por una ficha real (PDF) o una
          página técnica por SKU.
        </p>

        <div class="grid">
          <div class="row">
            <span class="label">SKU</span>
            <span class="value">—</span>
          </div>
          <div class="row">
            <span class="label">Composición</span>
            <span class="value">—</span>
          </div>
          <div class="row">
            <span class="label">Cuidados</span>
            <span class="value">—</span>
          </div>
        </div>

        <p class="note">
          Tip: si vas a servir PDFs, mantenelos livianos y con nombre estable (ej:
          <code>ficha-tecnica-sku.pdf</code>).
        </p>
      </div>
    </div>
  </body>
</html>
